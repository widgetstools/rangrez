<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HubDataProvider — React</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px ui-monospace, Menlo, monospace; background: #0e1216; color: #e7eaed; }
  header { padding: 10px 16px; background: #14181d; border-bottom: 1px solid #2b3138; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .sub { color: #8a939c; font-size: 11px; }
  .pill { padding: 2px 9px; border-radius: 10px; font-size: 11px; background: #1b2b1e; color: #8fd39b; }
  a { color: #e5a244; text-decoration: none; } a:hover { text-decoration: underline; }
  #grid { height: calc(100vh - 52px); width: 100%; }
  #boot { padding: 24px; color: #8a939c; }
</style>
</head>
<body>
<div id="root"><div id="boot">loading React + AG-Grid…</div></div>

<!-- React 19 ships CJS + no bundler here, so React comes from esm.sh; AG-Grid stays
     100% local (identical to the vanilla demo) so there's a single module instance. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8",
    "react-dom": "https://esm.sh/react-dom@19.2.8?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?external=react",
    "ag-stack": "/node_modules/ag-stack/dist/package/main.esm.mjs",
    "ag-grid-community": "/node_modules/ag-grid-community/dist/package/main.esm.mjs",
    "ag-grid-enterprise": "/node_modules/ag-grid-enterprise/dist/package/main.esm.mjs",
    "ag-grid-react": "https://esm.sh/ag-grid-react@36.0.0?external=react,react-dom,ag-grid-community"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { AgGridReact } from 'ag-grid-react';
import { ModuleRegistry, themeQuartz, colorSchemeDark, iconSetQuartzBold } from 'ag-grid-community';
import { AllEnterpriseModule } from 'ag-grid-enterprise';
import { HubDataProvider } from '/.demo/hub-data-provider.mjs';

ModuleRegistry.registerModules([AllEnterpriseModule]);

const theme = themeQuartz.withPart(colorSchemeDark).withPart(iconSetQuartzBold).withParams({
  backgroundColor: '#0e1216', foregroundColor: '#e7eaed', borderColor: '#2b3138',
  headerBackgroundColor: '#14181d', headerTextColor: '#8a939c', oddRowBackgroundColor: '#12161b',
  rowHoverColor: '#1a1f26', accentColor: '#e5a244', fontFamily: 'ui-monospace, Menlo, monospace',
  fontSize: 12, headerFontSize: 11, rowHeight: 26, headerHeight: 30,
});

const mode = (new URLSearchParams(location.search).get('mode') || 'ssrm').toLowerCase();

// ── describe the datasource once (same object the vanilla demo bootstraps) ──
const DATASOURCE = {
  id: 'positions', schemaRef: 'positions@v1', keyColumns: ['positionId'],
  columns: [
    { name: 'positionId', type: 'string' }, { name: 'desk', type: 'string' }, { name: 'trader', type: 'string' },
    { name: 'bookName', type: 'string' }, { name: 'instrumentType', type: 'string' }, { name: 'currency', type: 'string' },
    { name: 'marketValue', type: 'integer' }, { name: 'notionalAmount', type: 'integer' }, { name: 'dv01', type: 'float' },
    { name: 'currentPrice', type: 'float' }, { name: 'quantity', type: 'integer' }, { name: 'pnl', type: 'integer' },
  ],
  connection: { transport: 'stomp', url: 'ws://127.0.0.1:8081', vhost: 'localhost', heartbeat: { outMs: 1000, inMs: 10000 } },
  snapshot: { mode: 'trigger-reply', triggerDestination: '/snapshot/positions/{clientId}/{rate}/{batchSize}', replyDestination: '/snapshot/positions/{clientId}' },
  updates: { destination: '/snapshot/positions/{clientId}', bodyShape: 'record-array' },
};

// ── the reusable hook: one provider, connected for the component's lifetime ──
function useHubProvider(config) {
  const dp = useMemo(() => new HubDataProvider(config), []);          // created once
  const [state, setState] = useState('connecting');
  useEffect(() => {
    let live = true;
    dp.connect().then(() => live && setState('live')).catch((e) => live && setState('error: ' + (e.message ?? e)));
    return () => { live = false; dp.dispose(); };                    // close socket on unmount
  }, [dp]);
  return { dp, state };
}

function Blotter() {
  const { dp, state } = useHubProvider({
    hubUrl: 'ws://127.0.0.1:8787', mode,
    params: { clientId: 'react-' + mode, rate: 2000, batchSize: 10 },
    grid: { group: ['desk', 'trader'], agg: { marketValue: 'sum', notionalAmount: 'sum', dv01: 'sum' } },
    datasource: DATASOURCE,
  });

  return (
    <>
      <header>
        <h1>HubDataProvider</h1>
        <span className="pill">React · {mode.toUpperCase()}</span>
        <span className="sub">&lt;AgGridReact&gt; ⟶ provider ⟶ hub :8787 ⟶ STOMP :8081</span>
        <span className="sub">switch: <a href="?mode=ssrm">SSRM</a> · <a href="?mode=csrm">CSRM</a></span>
        <span className="sub">{state}</span>
      </header>
      {state === 'live' ? (
        // gate the grid on `live` so onGridReady (→ attach) runs after connect/subscribe
        <div id="grid">
          <AgGridReact
            theme={theme}
            columnDefs={dp.columnDefs()}
            defaultColDef={{ sortable: true, resizable: true, filter: true, flex: 1, minWidth: 110 }}
            {...dp.gridOptions()}
            onGridReady={(e) => { window.__grid = e.api; window.__dp = dp; dp.attach(e.api); }}
          />
        </div>
      ) : (
        <div id="boot">{state === 'connecting' ? 'connecting to hub…' : state}</div>
      )}
    </>
  );
}

createRoot(document.getElementById('root')).render(<Blotter />);
</script>
</body>
</html>
